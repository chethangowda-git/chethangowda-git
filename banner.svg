<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="0.55" stop-color="#d9d9d9"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d0d0d0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="haze"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="400" fill="url(#sky)"/>
  <ellipse cx="600" cy="230" rx="520" ry="40" fill="#ffffff" opacity="0.5" filter="url(#haze)"/>

  <!-- text -->
  <g font-family="'Courier New', Courier, monospace" fill="#222222" text-anchor="middle">
    <text x="600" y="105" font-size="40" letter-spacing="1">Welcome to Chethan's GitHub
      <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
    </text>
    <text x="600" y="150" font-size="30">&lt;/&gt;
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- far dunes -->
  <path d="M0 250 C 150 215, 300 235, 420 225 C 560 212, 700 240, 840 222 C 980 205, 1100 230, 1200 220 L1200 400 L0 400 Z" fill="#8c8c8c"/>
  <!-- mid dunes -->
  <path d="M0 275 C 120 250, 260 265, 380 258 C 520 250, 640 280, 780 262 C 920 245, 1060 270, 1200 255 L1200 400 L0 400 Z" fill="#555555"/>
  <!-- near dunes -->
  <path d="M0 300 C 160 270, 330 300, 470 290 C 620 280, 720 310, 880 292 C 1020 278, 1120 300, 1200 290 L1200 400 L0 400 Z" fill="url(#near)"/>

  <!-- winding river -->
  <path d="M598 262 C 610 275, 560 285, 575 298 C 595 315, 690 318, 665 338 C 640 358, 470 360, 500 382 C 515 393, 560 398, 570 400 L 650 400 C 620 395, 560 390, 575 380 C 600 366, 760 358, 730 334 C 705 314, 615 312, 600 298 C 590 288, 625 276, 606 262 Z"
        fill="url(#river)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- foreground shadow -->
  <path d="M0 345 C 200 330, 380 360, 520 400 L0 400 Z" fill="#000000" opacity="0.6"/>
  <path d="M1200 340 C 1000 328, 820 360, 700 400 L1200 400 Z" fill="#000000" opacity="0.6"/>
</svg>
